services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rememberme-postgres
    environment:
      POSTGRES_DB: rememberme
      POSTGRES_USER: rememberme
      POSTGRES_PASSWORD: rememberme_dev_password
    ports:
      - "5432:5432"
    volumes:
      - rememberme_postgres_data:/var/lib/postgresql/data

volumes:
  rememberme_postgres_data:
